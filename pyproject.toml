[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverable-tinyml"
version = "0.1.0"
description = "Recoverability-Aware Checkpoint Scheduling under Energy and Storage Budgets for Intermittent TinyML"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
recoverable-tinyml = "recoverable_tinyml.cli:main"

[tool.setuptools.packages.find]
include = ["recoverable_tinyml*"]
